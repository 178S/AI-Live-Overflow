<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background: transparent; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  img { width: 100px; height: auto; animation: breathe 2.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.03); }
  }
</style>
</head>
<body>
  <img src="cat.gif" alt="cat" />
</body>
</html>
